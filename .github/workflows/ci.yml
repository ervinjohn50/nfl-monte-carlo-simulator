name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: g++
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make CXX=${{ matrix.compiler }}

      - name: Test
        run: make test CXX=${{ matrix.compiler }}
